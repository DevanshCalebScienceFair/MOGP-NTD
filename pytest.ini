[pytest]
# external/ holds the pinned GP-MOBO clone (see gpmobo_ref.py). It ships its own
# test files that are not ours to run — and that fail to import outside their own
# tree — so keep collection out of it.
norecursedirs = external .git __pycache__ .pytest_cache data results* baseline_* benchmark_* ablation_*

markers =
    slow: end-to-end tests that run a short optimization loop (seconds, not milliseconds)
