[pytest]
# `slow` covers tests that run real Vina docking (seconds to minutes), not
# milliseconds. They are deselected by default so a plain `pytest` stays fast
# enough that nobody is tempted to skip the suite; run them explicitly with
# `pytest -m slow` or by naming the file.
markers =
    slow: real docking runs (minutes, not milliseconds)

addopts = -m "not slow"

# Generated output and vendored trees hold their own test files, which are not
# ours to collect.
norecursedirs =
    .git __pycache__ .pytest_cache external data
    results* baseline_* benchmark_* ablation_* matrix_results*
    apo_backup_* verification
